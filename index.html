<body class="cover">

<!-- =====================================================================
     THE FRONTISPIECE.

     A missal opens on a full-page image before a word of text, and this is
     that page. It is the one screen on the site with its own palette: the
     church interior, dark and gold and candlelit. Entering opens into the
     missal itself, which is paper and ink and red. The contrast is the
     point, the way a book feels different from its cover.

     The title, motto and button are REAL TEXT set over the artwork rather
     than baked into it. That keeps them crisp at every size, selectable and
     translatable, lets the button take keyboard focus, and means the wording
     can change without touching the image.
     ===================================================================== -->
<main class="poster">

  <img class="poster-art"
       src="eucharist.jpg"
       srcset="eucharist-640.jpg 640w, eucharist.jpg 1024w"
       sizes="(max-width: 620px) 100vw, 560px"
       alt="A vested priest raises the Eucharist at Mass. The host stands where his face would be, so that only Christ is seen, ringed with light, while two angels bow on either side.">

  <div class="poster-scrim" aria-hidden="true"></div>

  <div class="poster-text">
    <h1 class="poster-title">Reform of Life</h1>

    <!-- Drawn, not typed. The cross character (U+271D) is mapped to an emoji
         on Apple platforms, so it arrived as a flat purple glyph that no CSS
         colour could touch; a font cannot substitute a path. Flanked by two
         hairlines the way the ornament sits in the original poster. -->
    <div class="poster-rule" aria-hidden="true">
      <span class="poster-rule-line"></span>
      <svg class="poster-cross" viewBox="0 0 24 32" aria-hidden="true">
        <path d="M12 2 L12 30 M4 10 L20 10" />
      </svg>
      <span class="poster-rule-line"></span>
    </div>

    <p class="poster-motto">Return to Christ.<br>Renew your heart.<br>Transform your life.</p>

    <a class="poster-enter" href="practices.html">Enter</a>
  </div>

</main>
